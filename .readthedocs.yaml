# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: uv
      command: pip
      path: .
      extras:
        - docs
