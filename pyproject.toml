[build-system]
requires = ["setuptools>=77.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pymcnp"
authors = [
   { name = "Mauricio Ayllon Unzueta", email = "mauri.ayllon12@gmail.com" },
   { name = "Arun Persaud", email = "apersaud@lbl.gov" },
   { name = "Devin Pease", email = "dmpease@lbl.gov" },
]
description = "Python-based MCNP tools."
readme = "README.md"
license = "BSD-3-Clause-LBNL"
license-files = ["LICENSE"]
keywords = ["MCNP", "Monte Carlo", "particle transport", "radiation transport", "input files"]
dynamic = ["version"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "docopt",
    "fastparquet",
    "matplotlib",
    "molmass",
    "numpy",
    "pandas",
    "pyvista",
    "rich",
    "scipy",
]

[project.optional-dependencies]
docs = [
    "myst_parser",
    "Sphinx",
    "sphinx_rtd_theme",
]

dev = [
    "pre-commit",
    "ruff",
]

test = [
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-testmon",
]


[project.urls]
Documentation = "https://pymcnp.readthedocs.io/en/latest/"
Homepage = "https://github.com/FSIBT/PyMCNP"
Issues = "https://github.com/FSIBT/PyMCNP/issues"
Changelog = "https://github.com/FSIBT/PyMCNP/blob/main/CHANGELOG.md"

[project.scripts]
pymcnp = "pymcnp._cli.main:main"

[tool.setuptools.packages.find]
where = ["./src"]

[tool.setuptools_scm]
version_file = "src/version.py"

[tool.pytest.ini_options]
addopts = "--testmon --cov --cov-report=term-missing:skip-covered"
env = ["MPLBACKEND=Agg"]
testpaths = [
    "tests"
]

[tool.ruff]
line-length = 200
target-version = "py311"
lint.select = ["E4", "E7", "E9", "F", "PLW", "BLE", "S112", "PLR1722", "SIM", "RUF013", "C4"]
lint.ignore = ["E741", "E742"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80
