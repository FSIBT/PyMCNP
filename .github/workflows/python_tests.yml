name: Run Python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Installing Ruff
      run: python -m pip install ruff==0.17.0

    - name: Checking with Ruff
      run: ruff check --output-format=github .

    - name: Checking format with Ruff
      run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Python 3.15 is not tested: vtk (pyvista) does not publish wheels for it yet, so `import pymcnp` fails.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Setting Up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Upgrading pip
      run: python -m pip install --upgrade pip

    - name: Installing packages
      run: python -m pip install -e .[dev,docs,test]

    - name: Testing with PyTest
      run: python -m pytest
